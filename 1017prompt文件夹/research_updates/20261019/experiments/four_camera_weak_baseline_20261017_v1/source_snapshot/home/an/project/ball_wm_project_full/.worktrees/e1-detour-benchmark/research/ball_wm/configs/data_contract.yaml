schema_version: "2.0.0"
project: ball_wm_pointgoal
status: phase0_frozen

rates_hz:
  physics: 50
  control: 50
  stereo: 10
  state: 50

timing:
  clock: monotonic_sim_time
  physics_dt_s: 0.02
  control_period_s: 0.02
  stereo_period_s: 0.1
  state_period_s: 0.02
  stereo_sync_tolerance_s: 0.002
  state_to_image_tolerance_s: 0.005
  action_semantics: zero_order_hold
  transition_definition: "observation_t plus action_window_t_to_t1 predicts observation_t1"
  required_fields:
    - physics_step
    - sim_time
    - state_timestamp
    - action_command_timestamp
    - action_applied_timestamp
    - stereo_frame_id
    - left_timestamp
    - right_timestamp

frames:
  world:
    convention: fixed_navigation_frame
    use: [ground_truth_pose, pointgoal_world, evaluation]
  base:
    convention: x_forward_y_left_z_up
    use: [model_state, relative_motion, pointgoal_local, bev]
  camera_left:
    parent: base
    transform: fixed_calibrated_extrinsic
  camera_right:
    parent: base
    transform: fixed_calibrated_extrinsic
  bev:
    parent: base
    origin: robot_center
    image_up: base_positive_x
    image_left: base_positive_y

action:
  protocol_id: ball_action_v2_aux30
  dimension: 2
  controls_per_block: 5
  dtype: float32
  fields:
    - name: main_joint_velocity_cmd
      index: 0
      control_mode: velocity
      unit: rad_per_s
      positive_direction: increasing_simulator_joint_coordinate
      navigation_effect: verify_with_phase1_sign_test
      minimum: -2.0
      maximum: 2.0
    - name: auxiliary_joint_angle_cmd
      index: 1
      control_mode: position
      unit: rad
      positive_direction: increasing_simulator_joint_coordinate
      navigation_effect: verify_with_phase1_sign_test
      minimum: -0.5235987756
      maximum: 0.5235987756
  store_commanded_and_applied: true
  unused_dimensions: 0

raw_state:
  required_fields:
    - base_position_world_m
    - base_quaternion_world_wxyz
    - base_linear_velocity_world_mps
    - base_angular_velocity_world_radps
    - joint_position_rad
    - joint_velocity_radps
  joint_count: 3

model_state:
  frame: base
  dtype: float32
  fields:
    - name: base_linear_velocity
      dimension: 3
      unit: m_per_s
    - name: base_angular_velocity
      dimension: 3
      unit: rad_per_s
    - name: gravity_direction_in_base
      dimension: 3
      unit: normalized
    - name: joint_position
      dimension: 3
      unit: rad
    - name: joint_velocity
      dimension: 3
      unit: rad_per_s
    - name: previous_action
      dimension: 2
      unit: mixed_by_action_schema
  total_dimension: 17
  excludes:
    - absolute_world_position
    - absolute_world_yaw
    - independent_camera_pose

stereo:
  width_px: 640
  height_px: 480
  color_space: RGB
  left_right_same_physics_step: true
  hardware_or_simultaneous_trigger: true
  intrinsics_matrix_convention: "column vectors; p_image_homogeneous ~ K_camera_optical_to_image @ p_camera_optical"
  extrinsic_matrix_convention: "column vectors; source_to_target maps p_target = T_source_to_target @ p_source; left/right use OpenCV optical x_right_y_down_z_forward"
  calibration_required:
    left_intrinsics:
      shape: [3, 3]
      source_frame: camera_left_optical
      target_frame: left_image_homogeneous
    right_intrinsics:
      shape: [3, 3]
      source_frame: camera_right_optical
      target_frame: right_image_homogeneous
    left_to_right_extrinsic:
      shape: [4, 4]
      source_frame: camera_left_optical
      target_frame: camera_right_optical
    base_to_left_extrinsic:
      shape: [4, 4]
      source_frame: base
      target_frame: camera_left_optical
    base_to_right_extrinsic:
      shape: [4, 4]
      source_frame: base
      target_frame: camera_right_optical

pointgoal:
  model_input: false
  planner_input: true
  source: world_goal_and_current_localization
  representation: [delta_x_forward_m, delta_y_left_m]
  frame: base
  transform: "g_base = R_world_base_transpose * (p_goal_world - p_base_world)"

bev:
  frame: base
  extent_m: [8.0, 8.0]
  resolution_m: 0.1
  shape: [80, 80]
  classes: [free, occupied, unknown]
  class_codes:
    free: 0
    occupied: 1
    unknown: 2
  robot_inflation_during_label_generation: false
  robot_inflation_during_planning: true
  teacher_sources: [analytic_primitives, sim_depth, stereo_depth, pointcloud]

elevation:
  shape: [80, 80]
  enabled_by_default: true
  dtype: float32
  invalid_value: 0.0
  teacher_modes: [auto, analytic, raycast]

sample:
  history_duration_s: 0.5
  visual_history_frames: 5
  state_history_samples: 25
  action_history_samples: 25
  initial_prediction_horizon_s: 1.0
  visual_prediction_steps: 10
  includes_full_action_window_between_stereo_frames: true

split:
  unit: episode_and_scene
  adjacent_frame_random_split_forbidden: true
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  unseen_scene_test_required: true

deployment_inputs:
  - stereo_rgb
  - model_state_history
  - action_history
  - relative_pointgoal_for_planner

training_only_inputs:
  - depth_or_pointcloud_teacher
  - bev_ground_truth
  - world_pose_ground_truth

obstacle_labels:
  collision:
    dtype: bool
    cadence_hz: 10
    definition: minimum_obstacle_distance_less_than_or_equal_to_zero
    scope: two_dimensional_navigation_label
  minimum_obstacle_distance:
    dtype: float32
    unit: m
    cadence_hz: 10
    definition: nearest_occupied_bev_cell_center_distance_minus_ball_radius
    empty_occupancy_value: positive_infinity

episode_output:
  states_npz:
    state_fields:
      - physics_step
      - sim_time
      - state_timestamp
      - pos
      - quat
      - lin_vel
      - ang_vel
      - joint_pos
      - joint_vel
      - commanded_action
      - applied_action
      - action_command_timestamp
      - action_applied_timestamp
    stereo_fields:
      - stereo_frame_id
      - stereo_physics_step
      - left_timestamp
      - right_timestamp
      - cam_left_pose
      - cam_right_pose
      - left_filename
      - right_filename
      - collision
      - minimum_obstacle_distance
  visual_assets:
    required:
      - left_{stereo_frame_id:06d}.png
      - right_{stereo_frame_id:06d}.png
      - geometry_bev_{stereo_frame_id:06d}.png
      - current_visible_{stereo_frame_id:06d}.png
      - history_observed_{stereo_frame_id:06d}.png
    optional:
      - left_depth_{stereo_frame_id:06d}.npy
      - right_depth_{stereo_frame_id:06d}.npy
      - preview_{stereo_frame_id:06d}.png
  metadata_fields:
    - schema_version
    - contract_path
    - scene
    - episode_index
    - random_seed
    - rates_hz
    - physics_dt_s
    - rendering_dt_s
    - action_names
    - action_minimum
    - action_maximum
    - action_semantics
    - bev_extent_m
    - bev_resolution_m
    - bev_shape
    - bev_class_codes
    - bev_frame
    - visual_history_frames
    - ball_radius_m
    - collision_definition
    - minimum_obstacle_distance_definition
    - left_intrinsics
    - right_intrinsics
    - intrinsics_matrix_convention
    - extrinsic_matrix_convention
    - left_to_right_extrinsic
    - base_to_left_extrinsic
    - base_to_right_extrinsic
    - left_optical_to_base_extrinsic
    - right_optical_to_base_extrinsic
    - camera_pose_storage
    - depth_frame
    - depth_invalid_storage_value
    - waypoints_world_xy
    - sign_probe
    - sign_probe_steps
    - file_naming
    - save_depth
    - image_height_px
    - image_width_px
    - action_protocol_id
    - controls_per_block
